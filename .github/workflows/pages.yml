# SPDX-License-Identifier: Apache-2.0
#
# Build the website and publish it to GitHub Pages: the landing page, the
# rendered documentation and the viewer with the browser WASM package beside
# it. Runs on every push to main so the site is never older than the branch,
# and on demand.
#
# Enable it once in Settings, Pages, by setting the source to GitHub Actions.

name: Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deployment at a time. A newer push waits rather than cancelling, so the
# site always ends on the newest commit.
concurrency:
  group: pages
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0

jobs:
  build:
    name: build the site
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - uses: Swatinem/rust-cache@v2

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements-site.txt

      - name: install the website dependencies
        run: python -m pip install -r requirements-site.txt

      - name: install wasm-bindgen-cli at the locked version
        run: |
          version=$(python - <<'EOF'
          import re, pathlib
          lock = pathlib.Path("Cargo.lock").read_text(encoding="utf-8")
          match = re.search(r'name = "wasm-bindgen"\nversion = "([^"]+)"', lock)
          print(match.group(1))
          EOF
          )
          cargo install wasm-bindgen-cli --version "$version" --locked

      # The distribution package is years behind and its wasm-opt mis-links
      # the externref table, which stops the module from starting. Take a
      # pinned release from upstream and check its checksum instead.
      - name: install binaryen for wasm-opt
        env:
          BINARYEN_VERSION: version_132
          BINARYEN_SHA256: 195ddc94f9bc89f45abdabb0b9eea86023d727ba90eac8b35b80f2544fc30572
        run: |
          archive="binaryen-$BINARYEN_VERSION-x86_64-linux.tar.gz"
          curl -sSL --fail -o "$archive" \
            "https://github.com/WebAssembly/binaryen/releases/download/$BINARYEN_VERSION/$archive"
          echo "$BINARYEN_SHA256  $archive" | sha256sum --check
          tar -xzf "$archive" -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/binaryen-$BINARYEN_VERSION/bin" >> "$GITHUB_PATH"
          "$RUNNER_TEMP/binaryen-$BINARYEN_VERSION/bin/wasm-opt" --version

      - name: build the browser package
        run: python scripts/build-wasm.py --target web

      - name: test the website builder
        run: python -m unittest discover -s scripts -p 'test_build_site.py'

      # A project site lives under /<repo>/, so every URL the pages emit has to
      # carry that prefix. A user site is served from the root instead.
      - name: build the site
        run: |
          base="${{ github.event.repository.name }}"
          if [ "$base" = "${{ github.repository_owner }}.github.io" ]; then
            python scripts/build-site.py --base /
          else
            python scripts/build-site.py --base "/$base/"
          fi

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist/site

  deploy:
    name: deploy
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
