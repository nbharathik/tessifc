# SPDX-License-Identifier: Apache-2.0
[workspace]
resolver = "3"
members = [
    "crates/ifc-step",
    "crates/ifc-schema",
    "crates/ifc-model",
    "crates/ifc-geom",
    "crates/ifc-mesh",
    "crates/ifc-pack",
    "crates/ifc-engine",
    "bindings/wasm",
    "crates/ifc-cli",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
license = "Apache-2.0"
repository = "https://github.com/nbharathik/tessifc"
homepage = "https://github.com/nbharathik/tessifc"
authors = ["Bharathi Kannan"]
keywords = ["ifc", "bim", "geometry", "step", "wasm"]
categories = ["parser-implementations", "graphics", "wasm"]

[workspace.dependencies]
# Each member forwards its chosen schemas without inheriting workspace defaults.
tessifc-step = { version = "0.1.0", path = "crates/ifc-step", default-features = false }
tessifc-schema = { version = "0.1.0", path = "crates/ifc-schema", default-features = false }
tessifc-model = { version = "0.1.0", path = "crates/ifc-model", default-features = false }
tessifc-geom = { version = "0.1.0", path = "crates/ifc-geom", default-features = false }
tessifc-mesh = { version = "0.1.0", path = "crates/ifc-mesh", default-features = false }
tessifc-pack = { version = "0.1.0", path = "crates/ifc-pack", default-features = false }
tessifc-engine = { version = "0.1.0", path = "crates/ifc-engine", default-features = false }

# Runtime dependencies.
memchr = { version = "2.8", default-features = false }       # Unlicense OR MIT
phf = { version = "0.14", features = ["macros"] }             # MIT
rustc-hash = "2.1"                                            # Apache-2.0 OR MIT
thiserror = "2.0"                                             # MIT OR Apache-2.0
serde = { version = "1.0", features = ["derive"] }            # MIT OR Apache-2.0
serde_json = "1.0"                                            # MIT OR Apache-2.0
# Scalar f64 arithmetic keeps native and WASM geometry calculations consistent.
glam = { version = "0.33", default-features = false, features = ["std", "f64", "scalar-math"] }  # MIT OR Apache-2.0
earcutr = "0.5"                                               # ISC
rayon = "1.12"                                                # MIT OR Apache-2.0
clap = { version = "4.6", features = ["derive"] }             # MIT OR Apache-2.0
wasm-bindgen = "0.2"                                          # MIT OR Apache-2.0
js-sys = "0.3"                                                # MIT OR Apache-2.0
console_error_panic_hook = "0.1"                              # Apache-2.0 OR MIT

# Dev only.
proptest = "1.11"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 16

# The WASM artefact: one codegen unit and whole-program LTO run the kernel
# fastest in a browser, and wasm32 has no unwinding to keep.
[profile.wasm]
inherits = "release"
lto = "fat"
codegen-units = 1
panic = "abort"

# The size-optimised alternative, measurably slower.
[profile.wasm-release]
inherits = "release"
opt-level = "z"
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true
