# SPDX-License-Identifier: Apache-2.0
[package]
name = "tessifc-wasm"
description = "WebAssembly bindings for TessIFC."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
keywords.workspace = true
categories.workspace = true
readme = "README.md"
# Published to npm through the build script, never to crates.io.
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
tessifc-step = { workspace = true }
tessifc-schema = { workspace = true }
tessifc-model = { workspace = true }
tessifc-geom = { workspace = true }
tessifc-engine = { workspace = true }
tessifc-pack = { workspace = true }
glam = { workspace = true }
wasm-bindgen = { workspace = true }
js-sys = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }

# Unconditional on wasm so no build path can ship a module whose panics have
# no message.
[target.'cfg(target_arch = "wasm32")'.dependencies]
console_error_panic_hook = { workspace = true }

# Schema features must forward down the dependency chain, or a
# --no-default-features build still pulls in all three schemas.
[features]
default = ["schema-ifc2x3", "schema-ifc4", "schema-ifc4x3"]
schema-ifc2x3 = ["tessifc-schema/schema-ifc2x3", "tessifc-step/schema-ifc2x3", "tessifc-model/schema-ifc2x3", "tessifc-geom/schema-ifc2x3", "tessifc-engine/schema-ifc2x3"]
schema-ifc4 = ["tessifc-schema/schema-ifc4", "tessifc-step/schema-ifc4", "tessifc-model/schema-ifc4", "tessifc-geom/schema-ifc4", "tessifc-engine/schema-ifc4"]
schema-ifc4x3 = ["tessifc-schema/schema-ifc4x3", "tessifc-step/schema-ifc4x3", "tessifc-model/schema-ifc4x3", "tessifc-geom/schema-ifc4x3", "tessifc-engine/schema-ifc4x3"]
