# SPDX-License-Identifier: Apache-2.0
[package]
name = "tessifc-cli"
description = "Command line tool for TessIFC: info, convert, edit, coverage."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
keywords.workspace = true
categories.workspace = true
readme = "README.md"

[[bin]]
name = "tessifc"
path = "src/main.rs"

[dependencies]
# The workspace entry turns the crates' defaults off so a schema feature can be
# chosen; `tessifc edit` needs the step crate's editor on.
tessifc-step = { workspace = true, features = ["edit"] }
tessifc-schema = { workspace = true }
tessifc-model = { workspace = true }
tessifc-engine = { workspace = true, features = ["parallel"] }
tessifc-geom = { workspace = true }
rayon = { workspace = true }
clap = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }

# Schema features must forward down the dependency chain, or a
# --no-default-features build still pulls in all three schemas.
[features]
default = ["schema-ifc2x3", "schema-ifc4", "schema-ifc4x3", "ifczip"]
ifczip = ["tessifc-step/ifczip"]
schema-ifc2x3 = ["tessifc-schema/schema-ifc2x3", "tessifc-step/schema-ifc2x3", "tessifc-model/schema-ifc2x3", "tessifc-geom/schema-ifc2x3", "tessifc-engine/schema-ifc2x3"]
schema-ifc4 = ["tessifc-schema/schema-ifc4", "tessifc-step/schema-ifc4", "tessifc-model/schema-ifc4", "tessifc-geom/schema-ifc4", "tessifc-engine/schema-ifc4"]
schema-ifc4x3 = ["tessifc-schema/schema-ifc4x3", "tessifc-step/schema-ifc4x3", "tessifc-model/schema-ifc4x3", "tessifc-geom/schema-ifc4x3", "tessifc-engine/schema-ifc4x3"]
