# SPDX-License-Identifier: Apache-2.0
[package]
name = "tessifc-geom"
description = "IFC geometry evaluators: units, placements, curves, profiles, solids, styles."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
keywords.workspace = true
categories.workspace = true
readme = "README.md"

[dependencies]
tessifc-model = { workspace = true }
tessifc-step = { workspace = true }
tessifc-schema = { workspace = true }
tessifc-mesh = { workspace = true }
glam = { workspace = true }
rustc-hash = { workspace = true }
thiserror = { workspace = true }
serde = { workspace = true }

# Schema selection forwards down the whole dependency chain.
[features]
default = ["schema-ifc2x3", "schema-ifc4", "schema-ifc4x3"]
schema-ifc2x3 = ["tessifc-schema/schema-ifc2x3", "tessifc-model/schema-ifc2x3", "tessifc-step/schema-ifc2x3"]
schema-ifc4 = ["tessifc-schema/schema-ifc4", "tessifc-model/schema-ifc4", "tessifc-step/schema-ifc4"]
schema-ifc4x3 = ["tessifc-schema/schema-ifc4x3", "tessifc-model/schema-ifc4x3", "tessifc-step/schema-ifc4x3"]
