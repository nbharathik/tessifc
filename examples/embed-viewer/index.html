<!DOCTYPE html>
<!-- SPDX-License-Identifier: Apache-2.0 -->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>TessIFC · embedded viewer example</title>
<link rel="icon" href="data:,">
<style>
  :root { color-scheme: light dark; }
  * { box-sizing: border-box; }
  body {
    margin: 0; height: 100vh; overflow: hidden;
    font: 13px/1.5 ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
    background: #1b1d21; color: #e8e8ea;
  }
  #host { position: fixed; inset: 0; }
  #drop {
    position: fixed; inset: 0; display: grid; place-items: center;
    background: #1b1d21; z-index: 10; text-align: center; padding: 2rem;
  }
  #drop.hidden { display: none; }
  #drop h1 { font-size: 1.5rem; font-weight: 600; margin: 0 0 .5rem; }
  #drop p { margin: .25rem 0; color: #9a9ba0; }
  #drop.over { outline: 2px dashed #6ea8fe; outline-offset: -1rem; }
  #bar {
    position: fixed; top: 12px; left: 12px; display: flex; gap: 6px; flex-wrap: wrap;
    padding: 8px; background: #24262bcc; border: 1px solid #34363d; border-radius: 8px;
    backdrop-filter: blur(6px);
  }
  #bar button {
    font: inherit; padding: 4px 10px; border-radius: 6px; cursor: pointer;
    background: #2f3238; color: inherit; border: 1px solid #3f434b;
  }
  #bar button:hover { background: #3a3e46; }
  #status {
    position: fixed; bottom: 12px; left: 12px; padding: 6px 10px; color: #c8c9ce;
    background: #24262bcc; border: 1px solid #34363d; border-radius: 8px; font-variant-numeric: tabular-nums;
  }
</style>
</head>
<body>

<div id="host"></div>

<div id="drop">
  <div>
    <h1>TessIFC · embedded viewer</h1>
    <p>Drop an <code>.ifc</code> file here, or click to choose one.</p>
    <p style="margin-top:1rem"><small>Everything runs in this tab. Nothing is uploaded.</small></p>
    <p style="margin-top:1rem"><button id="follow" type="button">Follow the local session</button>
      <small>when this page is served by <code>tessifc-mcp</code> or the Python session</small></p>
    <input type="file" id="file" accept=".ifc" hidden>
  </div>
</div>

<div id="bar" hidden>
  <button id="fit">Fit</button>
  <button id="focus">Focus</button>
  <button id="top">Top</button>
  <button id="iso">3D</button>
  <button id="style">Style</button>
  <button id="hide">Hide</button>
  <button id="isolate">Isolate</button>
  <button id="show-all">Show all</button>
  <button id="section">Section</button>
</div>
<div id="status" hidden>-</div>

<!-- With a bundler these are the bare package names; served from a checkout
     the map points them at the source directories. -->
<script type="importmap">
{
  "imports": {
    "@tessifc/core/web": "../../bindings/wasm/pkg/tessifc_wasm.js",
    "@tessifc/edit/igp": "../../bindings/edit/src/igp.js",
    "@tessifc/edit/session": "../../bindings/edit/src/session.js",
    "@tessifc/viewer": "../../bindings/viewer/src/index.js"
  }
}
</script>
<script type="module" src="./main.js"></script>
</body>
</html>
