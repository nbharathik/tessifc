<!DOCTYPE html>
<!-- SPDX-License-Identifier: Apache-2.0 -->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>TessIFC · three.js integration example</title>
<style>
  :root { color-scheme: light dark; }
  * { box-sizing: border-box; }
  body {
    margin: 0; height: 100vh; overflow: hidden;
    font: 13px/1.5 ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
    background: #1b1d21; color: #e8e8ea;
  }
  canvas { display: block; }
  #drop {
    position: fixed; inset: 0; display: grid; place-items: center;
    background: #1b1d21; z-index: 10; text-align: center; padding: 2rem;
  }
  #drop.hidden { display: none; }
  #drop h1 { font-size: 1.5rem; font-weight: 600; margin: 0 0 .5rem; }
  #drop p { margin: .25rem 0; color: #9a9ba0; }
  #drop.over { outline: 2px dashed #6ea8fe; outline-offset: -1rem; }
  #panel {
    position: fixed; top: 12px; left: 12px; padding: 10px 14px;
    background: #24262bcc; border: 1px solid #34363d; border-radius: 8px;
    backdrop-filter: blur(6px); max-width: 320px; line-height: 1.7;
  }
  #panel b { font-weight: 600; }
  #panel .row { display: flex; justify-content: space-between; gap: 2rem; }
  #panel .row span:last-child { color: #9a9ba0; font-variant-numeric: tabular-nums; }
  #picked { margin-top: 8px; padding-top: 8px; border-top: 1px solid #34363d; color: #9a9ba0; }
  #picked.none { display: none; }
  .hint { position: fixed; bottom: 12px; left: 12px; color: #6d6e74; }
</style>
</head>
<body>

<div id="drop">
  <div>
    <h1>TessIFC · v0.3 preview</h1>
    <p>Drop an <code>.ifc</code> file here, or click to choose one.</p>
    <p style="margin-top:1rem"><small>Everything runs in this tab. Nothing is uploaded.</small></p>
    <input type="file" id="file" accept=".ifc" hidden>
  </div>
</div>

<div id="panel" hidden>
  <div class="row"><b id="name">-</b></div>
  <div class="row"><span>schema</span><span id="schema">-</span></div>
  <div class="row"><span>elements</span><span id="products">-</span></div>
  <div class="row"><span>triangles</span><span id="triangles">-</span></div>
  <div class="row"><span>draw calls</span><span id="batches">-</span></div>
  <div class="row"><span>parse</span><span id="parse">-</span></div>
  <div class="row"><span>geometry</span><span id="geometry">-</span></div>
  <div id="picked" class="none"></div>
</div>

<p class="hint" hidden id="hint">drag to orbit &middot; scroll to zoom &middot; click an element</p>

<!-- This example loads a pinned three.js release from a CDN. With a bundler the
     tessifc names are the bare packages; served from a checkout the map points
     them at the source directories. -->
<script type="importmap">
{
  "imports": {
    "three": "https://unpkg.com/three@0.169.0/build/three.module.js",
    "three/addons/": "https://unpkg.com/three@0.169.0/examples/jsm/",
    "@tessifc/core/web": "../../bindings/wasm/pkg/tessifc_wasm.js",
    "@tessifc/three": "../../adapters/three/src/index.js"
  }
}
</script>

<script type="module" src="./main.js"></script>
</body>
</html>
